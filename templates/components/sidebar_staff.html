<aside class="dashboard-sidebar">
  <div class="sidebar-header">
    <a href="{{ url_for('staff.dashboard') }}" class="sidebar-brand">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="MEMZO" onerror="this.onerror=null; this.src='{{ url_for('static', filename='images/logo.png') }}';">
    </a>
    
    <div class="sidebar-user-card">
      <div class="user-avatar-circle">
        {{ current_user.name[0] | upper }}
      </div>
      <div class="user-info-text">
        <div class="user-info-name">{{ current_user.name }}</div>
        <div class="user-info-role">Operations Staff</div>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-title">Workspace</div>
    <a href="{{ url_for('staff.dashboard') }}" class="sidebar-item {% if request.endpoint == 'staff.dashboard' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      Staff Dashboard
    </a>
    <a href="{{ url_for('staff.customers') }}" class="sidebar-item {% if 'staff.customer' in request.endpoint %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Customers
    </a>
    <a href="{{ url_for('staff.subscriptions') }}" class="sidebar-item {% if 'staff.subscription' in request.endpoint %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      Subscriptions
    </a>
    <a href="{{ url_for('staff.quotations') }}" class="sidebar-item {% if 'staff.quotation' in request.endpoint %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      Quotations
    </a>
    <a href="{{ url_for('staff.invoices') }}" class="sidebar-item {% if 'staff.invoice' in request.endpoint %}active{% endif %}">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"></rect><line x1="2" y1="9" x2="22" y2="9"></line><line x1="7" y1="14" x2="17" y2="14"></line></svg>
      Invoices
    </a>
    <a href="{{ url_for('staff.payments') }}" class="sidebar-item {% if 'staff.payment' in request.endpoint %}active{% endif %}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
      Record Payments
    </a>

    <div class="nav-section-title">Personal</div>
    <a href="{{ url_for('staff.notifications') }}" class="sidebar-item {% if request.endpoint == 'staff.notifications' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      Notifications
      {% if unread_notifications_count > 0 %}
        <span class="sidebar-badge">{{ unread_notifications_count }}</span>
      {% endif %}
    </a>
    <a href="{{ url_for('staff.profile') }}" class="sidebar-item {% if request.endpoint == 'staff.profile' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      Staff Profile
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="{{ url_for('auth.logout') }}" class="btn-sidebar-logout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      Sign Out
    </a>
  </div>
</aside>

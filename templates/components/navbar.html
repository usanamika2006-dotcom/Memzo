<nav class="site-nav">
  <a href="{{ url_for('public.index') }}" class="nav-brand">
    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="MEMZO Logo" onerror="this.onerror=null; this.src='{{ url_for('static', filename='images/logo.png') }}';">
  </a>

  <ul class="nav-links">
    <li>
      <a href="{{ url_for('public.products') }}" class="nav-link-item">
        Products
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </a>
    </li>
    <li>
      <a href="{{ url_for('public.products') }}" class="nav-link-item">
        Subscriptions
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </a>
    </li>
    <li>
      <a href="{{ url_for('public.products') }}" class="nav-link-item">Pricing</a>
    </li>
    <li>
      <a href="#features" class="nav-link-item">
        Resources
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </a>
    </li>
  </ul>

  <div class="nav-actions">
    {% if current_user.is_authenticated %}
      {% if current_user.is_admin %}
        <a href="{{ url_for('admin.dashboard') }}" class="btn-sign-in">Admin Dashboard</a>
      {% elif current_user.is_staff %}
        <a href="{{ url_for('staff.dashboard') }}" class="btn-sign-in">Staff Dashboard</a>
      {% else %}
        <a href="{{ url_for('customer.dashboard') }}" class="btn-sign-in">Customer Portal</a>
      {% endif %}
      <a href="{{ url_for('auth.logout') }}" class="btn-lime">Sign Out</a>
    {% else %}
      <a href="{{ url_for('auth.login') }}" class="btn-sign-in">Sign In</a>
      <a href="{{ url_for('auth.register') }}" class="btn-lime">Open An Account</a>
    {% endif %}
  </div>

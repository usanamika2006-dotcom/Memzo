<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin Dashboard — MEMZO{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">

  <!-- Bootstrap 5 Grid and Utilities -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Core & Dashboard CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  {% block extra_css %}{% endblock %}

  <!-- Chart.js for Admin Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
  {% include 'components/flash_messages.html' %}

  <div class="dashboard-layout">
    {% include 'components/sidebar_admin.html' %}

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="topbar-title">
          <h2>{% block page_title %}Administrator Control Center{% endblock %}</h2>
        </div>

        <div class="topbar-actions">
          <a href="{{ url_for('public.products') }}" target="_blank" class="btn-table-action">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            Live Storefront
          </a>
          <a href="{{ url_for('auth.logout') }}" class="btn-table-action" style="color: #b91c1c;">
            Sign Out
          </a>
        </div>
      </header>

      <div class="dashboard-content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- MEMZO Scripts -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
